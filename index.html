<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Обычная страница</title>
    <style>
        body {
            background-color: #f0f0f0;
            text-align: center;
            padding-top: 100px;
            font-family: Arial, sans-serif;
        }
        #scream-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            z-index: 9999;
        }
        #scream-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1>Добро пожаловать на сайт!</h1>
    <p>Нажмите на экран, чтобы продолжить.</p>

    <!-- Скрытый контейнер со скримером -->
    <div id="scream-container">
        <img src="jeff.jpg" alt="Скример">
        <audio id="scream-audio" src="scream.mp3"></audio>
    </div>

    <script>
        document.body.addEventListener('click', function() {
            var container = document.getElementById('scream-container');
            var audio = document.getElementById('scream-audio');
            
            container.style.display = 'block';
            audio.play();
        }, { once: true });
    </script>

</body>
</html>
